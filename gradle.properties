org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
org.gradle.caching=true
android.experimental.forceDeterministicApk=true
android.enableResourceOptimizations=false
android.useAndroidX=true
android.builtInKotlin=false
# Both stable linkers receive complete AAR overlays from CompileStableResources.
android.precompileDependenciesResources=false
# Compile against final IDs shared by the application and AndroidX libraries.
android.nonTransitiveRClass=false
android.enableAppCompileTimeRClass=false
android.nonFinalResIds=false
